<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Emotionless</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <img class="logo" src="icons/icon128.png" alt="" />
      <h1>Emotionless</h1>
      <label class="switch" title="모든 사이트에서 켜거나 끕니다">
        <input type="checkbox" role="switch" id="enabled" aria-label="Emotionless 켜기" />
        <span class="track"><span class="thumb"></span></span>
      </label>
    </header>

    <!-- 이 페이지의 분위기: 가장 많은 감정과 분포 -->
    <section class="mood" id="mood" aria-live="polite">
      <div class="mood-head">
        <img class="mood-face" id="moodFace" alt="" />
        <div class="mood-text">
          <p class="mood-title" id="moodTitle"></p>
          <p class="mood-sub" id="moodSub"></p>
        </div>
      </div>
      <div class="bar" id="bar" role="img" hidden></div>
      <ul class="chips" id="chips" hidden></ul>
      <button class="btn btn-primary" id="reload" type="button" hidden>새로 고침</button>
    </section>

    <div id="controls">
      <section class="group" id="siteGroup">
        <label class="row">
          <span class="row-text">
            <span class="row-title">이 사이트에서 사용</span>
            <span class="row-sub" id="host"></span>
          </span>
          <span class="switch">
            <input type="checkbox" role="switch" id="site" />
            <span class="track"><span class="thumb"></span></span>
          </span>
        </label>
      </section>

      <section class="group">
        <!-- 걸러 보는 정도: 약한 것부터 네 단계. 고르면 아래 예시가 바로 바뀐다. -->
        <fieldset class="level">
          <legend class="row-title">걸러 보는 정도</legend>
          <div class="seg-control" id="levels">
            <label><input type="radio" name="level" value="label" /><span>표시만</span></label>
            <label><input type="radio" name="level" value="clean" /><span>순화</span></label>
            <label><input type="radio" name="level" value="fold" /><span>접기</span></label>
            <label><input type="radio" name="level" value="hide" /><span>숨기기</span></label>
          </div>
          <p class="row-sub" id="levelSub"></p>
          <div class="preview" id="preview" data-group="anger" aria-label="화난 댓글이 보이는 모습 예시">
            <img id="previewFace" alt="" />
            <span id="previewText"></span>
          </div>
        </fieldset>
        <label class="row">
          <span class="row-text">
            <span class="row-title">화면 구석에 반응 요약 띄우기</span>
          </span>
          <span class="switch">
            <input type="checkbox" role="switch" id="showPill" />
            <span class="track"><span class="thumb"></span></span>
          </span>
        </label>
      </section>

      <!-- 판정 고치기: 얼굴을 누르거나 글을 드래그해 고친 내용 -->
      <section class="group" id="learnGroup">
        <label class="row" id="shareRow">
          <span class="row-text">
            <span class="row-title">고친 내용을 개선에 보내기</span>
            <span class="row-sub">고친 댓글의 글과 고친 내용만 보내 모델 학습에 써요.</span>
          </span>
          <span class="switch">
            <input type="checkbox" role="switch" id="shareFeedback" />
            <span class="track"><span class="thumb"></span></span>
          </span>
        </label>
        <div class="row" id="fixRow">
          <span class="row-text">
            <span class="row-title">내가 고친 것</span>
            <span class="row-sub" id="fixSub"></span>
          </span>
          <button class="btn btn-quiet" id="resetFixes" type="button">모두 지우기</button>
        </div>
      </section>

      <section class="group" id="locationGroup">
        <div class="row">
          <span class="row-text">
            <span class="row-title">댓글 위치</span>
            <span class="row-sub" id="locationSub"></span>
          </span>
          <button class="btn" id="pick" type="button">직접 지정</button>
        </div>
        <button class="btn btn-quiet" id="resetPick" type="button" hidden>자동으로 찾기로 되돌리기</button>
      </section>
    </div>

    <footer class="foot">
      <a href="https://on-future.github.io/emotionless/support.html" target="_blank" rel="noopener">도움말</a>
      <span id="version"></span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
